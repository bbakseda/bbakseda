<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>우리집 꾸미기</title>
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #1e293b;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100dvh;
    }

    /* 방 화면 영역 */
    #stage-parent {
      width: 100vw;
      height: 70vh;
      height: 70dvh;
      position: relative;
      background: #fdf6ec;
    }

    /* 하단 패널 */
    #bottom-panel {
      width: 100vw;
      height: 30vh;
      height: 30dvh;
      background: #ffffff;
      border-top: 4px solid #f59e0b;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
      z-index: 20;
      padding-bottom: env(safe-area-inset-bottom);
    }

    #control-tabs {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
      overflow-x: auto;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tab-group, .action-group {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .category-btn {
      padding: 7px 14px;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid #cbd5e1;
      border-radius: 18px;
      background: #ffffff;
      cursor: pointer;
    }
    .category-btn.active {
      background: #f59e0b;
      border-color: #d97706;
      color: #ffffff;
    }

    .action-btn {
      padding: 6px 10px;
      font-size: 13px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: white;
    }
    .btn-save { background: #3b82f6; }
    .btn-load { background: #10b981; }
    .btn-photo { background: #ec4899; }
    .btn-clear { background: #ef4444; }

    #item-tray {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }

    .item-card {
      min-width: 68px;
      height: 68px;
      background: #f1f5f9;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .item-card:active {
      transform: scale(0.92);
      background: #e2e8f0;
    }
    .item-card .icon {
      font-size: 28px;
      line-height: 1;
    }
    .item-card .label {
      font-size: 11px;
      margin-top: 3px;
      font-weight: bold;
      color: #475569;
    }

    #trash-can {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px dashed #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="app-container">
  <div id="stage-parent">
    <div id="trash-can">🗑️</div>
  </div>

  <div id="bottom-panel">
    <div id="control-tabs">
      <div class="tab-group">
        <button class="category-btn active" onclick="switchCategory('room')">🏡 방</button>
        <button class="category-btn" onclick="switchCategory('furniture')">🛋️ 가구</button>
        <button class="category-btn" onclick="switchCategory('toys')">🧸 장난감</button>
        <button class="category-btn" onclick="switchCategory('pets')">🐶 동물</button>
      </div>
      <div class="action-group">
        <button class="action-btn btn-save" onclick="saveRoom()">💾 저장</button>
        <button class="action-btn btn-load" onclick="loadRoom()">📂 열기</button>
        <button class="action-btn btn-photo" onclick="exportPhoto()">📸 찰칵</button>
        <button class="action-btn btn-clear" onclick="resetRoom()">🧹 비우기</button>
      </div>
    </div>
    <div id="item-tray"></div>
  </div>
</div>

<script>
  const container = document.getElementById('stage-parent');
  
  // 캔버스 크기 취득 (0 방지용 폴백 포함)
  function getStageDimensions() {
    return {
      width: container.clientWidth || window.innerWidth,
      height: container.clientHeight || Math.floor(window.innerHeight * 0.7)
    };
  }

  const initialDim = getStageDimensions();
  const stage = new Konva.Stage({
    container: 'stage-parent',
    width: initialDim.width,
    height: initialDim.height,
  });

  // 배경 레이어와 소품 레이어 (순서 엄격 분리)
  const bgLayer = new Konva.Layer({ listening: false }); // 배경은 터치 이벤트 무시(성능 향상)
  const furnitureLayer = new Konva.Layer();
  
  stage.add(bgLayer);
  stage.add(furnitureLayer);

  // 테마 색상 정의
  const roomThemes = {
    warm: { wall: '#FFF2D6', floor: '#D4A373', skirting: '#A66A38', windowSky: '#90E0EF' },
    cozy: { wall: '#E8F3EE', floor: '#B7B7A4', skirting: '#6B705C', windowSky: '#CAF0F8' },
    candy: { wall: '#FCE7F3', floor: '#FBCFE8', skirting: '#F472B6', windowSky: '#E0AAFF' },
    night: { wall: '#1E293B', floor: '#334155', skirting: '#0F172A', windowSky: '#020617' }
  };
  let currentTheme = 'warm';

  // 소품 데이터
  const itemsData = {
    room: [
      { icon: '🪵', label: '나무방', action: () => setRoomTheme('warm') },
      { icon: '🌿', label: '민트방', action: () => setRoomTheme('cozy') },
      { icon: '🍬', label: '핑크방', action: () => setRoomTheme('candy') },
      { icon: '🌙', label: '밤하늘', action: () => setRoomTheme('night') },
    ],
    furniture: [
      { icon: '🛏️', label: '침대', baseSize: 70 },
      { icon: '🛋️', label: '소파', baseSize: 65 },
      { icon: '🪑', label: '의자', baseSize: 50 },
      { icon: '🚪', label: '문', baseSize: 80 },
      { icon: '🪴', label: '화분', baseSize: 55 },
      { icon: '💡', label: '조명', baseSize: 50 },
      { icon: '📚', label: '책장', baseSize: 75 },
    ],
    toys: [
      { icon: '🧸', label: '곰인형', baseSize: 55 },
      { icon: '🤖', label: '로봇', baseSize: 50 },
      { icon: '🚗', label: '자동차', baseSize: 45 },
      { icon: '🎈', label: '풍선', baseSize: 60 },
      { icon: '🎁', label: '선물', baseSize: 45 },
    ],
    pets: [
      { icon: '🐶', label: '강아지', baseSize: 55 },
      { icon: '🐱', label: '고양이', baseSize: 50 },
      { icon: '🐰', label: '토끼', baseSize: 50 },
      { icon: '🐹', label: '햄스터', baseSize: 40 },
    ]
  };

  // 벽, 바닥, 걸레받이, 창문 확실하게 렌더링
  function renderRoomBackground() {
    bgLayer.destroyChildren();

    const w = stage.width();
    const h = stage.height();
    const theme = roomThemes[currentTheme];
    
    const wallH = h * 0.65;
    const floorH = h * 0.35;

    // 1. 벽면
    bgLayer.add(new Konva.Rect({
      x: 0,
      y: 0,
      width: w,
      height: wallH,
      fill: theme.wall,
    }));

    // 2. 바닥면
    bgLayer.add(new Konva.Rect({
      x: 0,
      y: wallH,
      width: w,
      height: floorH,
      fill: theme.floor,
    }));

    // 3. 걸레받이 몰딩
    bgLayer.add(new Konva.Rect({
      x: 0,
      y: wallH - 10,
      width: w,
      height: 10,
      fill: theme.skirting,
    }));

    // 4. 창문 (크기 반응형 계산)
    const winW = Math.min(w * 0.28, 130);
    const winH = winW * 0.85;
    const winX = w * 0.65;
    const winY = h * 0.12;

    bgLayer.add(new Konva.Rect({
      x: winX,
      y: winY,
      width: winW,
      height: winH,
      fill: theme.windowSky,
      stroke: '#ffffff',
      strokeWidth: 6,
      cornerRadius: 12,
      shadowColor: 'rgba(0,0,0,0.15)',
      shadowBlur: 8,
    }));

    // 창살 십자선
    bgLayer.add(new Konva.Line({
      points: [winX + winW / 2, winY, winX + winW / 2, winY + winH],
      stroke: '#ffffff',
      strokeWidth: 4,
    }));
    bgLayer.add(new Konva.Line({
      points: [winX, winY + winH / 2, winX + winW, winY + winH / 2],
      stroke: '#ffffff',
      strokeWidth: 4,
    }));

    bgLayer.draw();
  }

  function setRoomTheme(themeKey) {
    currentTheme = themeKey;
    renderRoomBackground();
  }

  // 가구 배치
  function spawnItem(emoji, baseSize, ratioX = 0.5, ratioY = 0.55) {
    const w = stage.width();
    const h = stage.height();
    const scaleFactor = Math.min(w, h) / 400;
    const size = Math.max(baseSize * scaleFactor, 36);

    const itemGroup = new Konva.Group({
      x: w * ratioX,
      y: h * ratioY,
      draggable: true,
      name: 'furniture-item',
    });

    itemGroup.setAttr('itemData', { emoji, baseSize });

    const textNode = new Konva.Text({
      text: emoji,
      fontSize: size,
      align: 'center',
    });

    itemGroup.add(textNode);
    furnitureLayer.add(itemGroup);

    itemGroup.on('dragstart touchstart', function () {
      this.moveToTop();
      this.scale({ x: 1.2, y: 1.2 });
      furnitureLayer.batchDraw();
    });

    itemGroup.on('dragend touchend', function () {
      this.scale({ x: 1.0, y: 1.0 });
      const pos = this.absolutePosition();
      if (pos.x > stage.width() - 80 && pos.y < 80) {
        this.destroy();
      }
      furnitureLayer.batchDraw();
    });

    furnitureLayer.draw();
  }

  // 리사이즈 시 배경 재도색 및 소품 위치 유지
  window.addEventListener('resize', () => {
    const prevW = stage.width();
    const prevH = stage.height();
    const dim = getStageDimensions();

    stage.width(dim.width);
    stage.height(dim.height);

    renderRoomBackground();

    furnitureLayer.find('.furniture-item').forEach(group => {
      const rx = group.x() / prevW;
      const ry = group.y() / prevH;
      group.x(dim.width * rx);
      group.y(dim.height * ry);

      const meta = group.getAttr('itemData');
      const textChild = group.findOne('Text');
      if (meta && textChild) {
        const factor = Math.min(dim.width, dim.height) / 400;
        textChild.fontSize(Math.max(meta.baseSize * factor, 36));
      }
    });

    furnitureLayer.batchDraw();
  });

  function switchCategory(catKey) {
    document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    const tray = document.getElementById('item-tray');
    tray.innerHTML = '';

    itemsData[catKey].forEach(item => {
      const card = document.createElement('div');
      card.className = 'item-card';

      if (catKey === 'room') {
        card.innerHTML = `<span class="icon">${item.icon}</span><span class="label">${item.label}</span>`;
        card.onclick = item.action;
      } else {
        card.innerHTML = `<span class="icon">${item.icon}</span><span class="label">${item.label}</span>`;
        card.onclick = () => spawnItem(item.icon, item.baseSize);
      }
      tray.appendChild(card);
    });
  }

  function saveRoom() {
    const items = [];
    const w = stage.width();
    const h = stage.height();

    furnitureLayer.find('.furniture-item').forEach(group => {
      const meta = group.getAttr('itemData');
      if (meta) {
        items.push({
          emoji: meta.emoji,
          baseSize: meta.baseSize,
          ratioX: group.x() / w,
          ratioY: group.y() / h
        });
      }
    });

    localStorage.setItem('room_save_v2', JSON.stringify({ theme: currentTheme, items }));
    alert('방이 깔끔하게 저장되었습니다! 💾');
  }

  function loadRoom() {
    const raw = localStorage.getItem('room_save_v2');
    if (!raw) return alert('저장된 집이 없습니다.');

    const data = JSON.parse(raw);
    setRoomTheme(data.theme);
    furnitureLayer.destroyChildren();

    data.items.forEach(it => {
      spawnItem(it.emoji, it.baseSize, it.ratioX, it.ratioY);
    });
    alert('방을 불러왔습니다! 🏡');
  }

  function exportPhoto() {
    const trash = document.getElementById('trash-can');
    trash.style.display = 'none';

    setTimeout(() => {
      const dataURL = stage.toDataURL({ pixelRatio: 2 });
      trash.style.display = 'flex';

      const a = document.createElement('a');
      a.download = `내방꾸미기_${Date.now()}.png`;
      a.href = dataURL;
      a.click();
    }, 40);
  }

  function resetRoom() {
    if (confirm('방 안의 물건을 싹 치울까요?')) {
      furnitureLayer.destroyChildren();
      furnitureLayer.draw();
    }
  }

  // 시작 시 방 풍경 렌더링 및 첫 탭 활성화
  renderRoomBackground();
  switchCategory('room');
</script>
</body>
</html>
