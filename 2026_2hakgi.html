<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학습 결과 제출</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: white; width: 100%; max-width: 480px; padding: 28px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; text-align: center; color: #1e293b; font-size: 22px; }
    p.sub { text-align: center; color: #64748b; font-size: 14px; margin-top: -6px; margin-bottom: 24px; }
    
    .grid-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .col { flex: 1; display: flex; flex-direction: column; }
    
    label { font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    
    button { width: 100%; margin-top: 14px; padding: 14px; background-color: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    
    .msg { margin-top: 14px; text-align: center; font-size: 14px; display: none; }
    .msg.success { color: #16a34a; font-weight: 600; display: block; }
    .msg.error { color: #dc2626; font-weight: 600; display: block; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📝 학습 결과 입력</h2>
    <p class="sub">본인의 정보와 평가 결과를 입력해주세요.</p>

    <form id="recordForm">
      <div class="grid-row">
        <div class="col">
          <label for="grade">학년</label>
          <input type="number" id="grade" placeholder="예: 5" required min="1" max="6">
        </div>
        <div class="col">
          <label for="classNum">반</label>
          <input type="number" id="classNum" placeholder="예: 2" required min="1">
        </div>
        <div class="col">
          <label for="studentNum">번호</label>
          <input type="number" id="studentNum" placeholder="예: 15" required min="1">
        </div>
      </div>

      <div class="grid-row">
        <div class="col">
          <label for="name">이름</label>
          <input type="text" id="name" placeholder="홍길동" required>
        </div>
      </div>

      <div class="grid-row">
        <div class="col">
          <label for="subject">과목</label>
          <input type="text" id="subject" placeholder="예: 과학" required>
        </div>
        <div class="col">
          <label for="unit">단원</label>
          <input type="text" id="unit" placeholder="예: 3. 빛의 나아감" required>
        </div>
      </div>

      <div class="grid-row">
        <div class="col">
          <label for="score">점수</label>
          <input type="number" id="score" placeholder="100" required min="0" max="100">
        </div>
      </div>

      <button type="submit" id="submitBtn">제출하기</button>
      <div id="statusMsg" class="msg"></div>
    </form>
  </div>

  <script>
    // ⚠️ 2단계에서 복사한 구글 앱스 스크립트 웹 앱 URL을 여기에 붙여넣으세요.
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwLrDtRhwup9Qhg_fKYDTo_4yfA-gqvP9ZxMUSfkPaWQAkjuo4sSqf3sutxCHQgT0Q3/exec";

    const form = document.getElementById("recordForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.textContent = "저장 중...";
      statusMsg.className = "msg";
      statusMsg.textContent = "";

      const payload = {
        grade: document.getElementById("grade").value,
        classNum: document.getElementById("classNum").value,
        studentNum: document.getElementById("studentNum").value,
        name: document.getElementById("name").value.trim(),
        subject: document.getElementById("subject").value.trim(),
        unit: document.getElementById("unit").value.trim(),
        score: document.getElementById("score").value
      };

      try {
        // no-cors 모드로 전송하여 브라우저 CORS 차단 문제 방지
        await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          mode: "no-cors"
        });

        statusMsg.className = "msg success";
        statusMsg.textContent = "✅ 성공적으로 저장되었습니다!";
        form.reset();
      } catch (err) {
        console.error(err);
        statusMsg.className = "msg error";
        statusMsg.textContent = "❌ 전송 중 오류가 발생했습니다. 다시 시도해주세요.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "제출하기";
      }
    });
  </script>
</body>
</html>
