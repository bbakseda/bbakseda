<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화단 설계 도구</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            overflow: hidden;
        }
        #toolbar {
            background-color: #343a40;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1000;
        }
        button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #45a049;
        }
        #canvas {
            width: 100vw;
            height: calc(100vh - 60px);
            position: relative;
            background-color: #e9ecef;
            overflow: hidden;
            background-image: radial-gradient(#ced4da 1px, transparent 1px);
            background-size: 20px 20px; /* 모눈종이 느낌 */
        }
        .bed {
            position: absolute;
            background-color: #d4a373;
            border: 3px dashed #8b5a2b;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #5c3a21;
            font-weight: bold;
            cursor: grab;
            user-select: none;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
        }
        .plant {
            position: absolute;
            background-color: #a8d5ba;
            border: 2px solid #2d6a4f;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            color: #1b4332;
            cursor: grab;
            user-select: none;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
            z-index: 10; /* 식물이 화단 위로 올라오게 */
            word-break: keep-all;
        }
        .draggable:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <button onclick="addBed()">🟫 화단(직사각형) 추가</button>
        <button onclick="addPlant()">🌱 식물(동그라미) 추가</button>
    </div>

    <div id="canvas"></div>

    <script>
        const canvas = document.getElementById('canvas');
        // 1m를 50px로 환산하여 화면에 적절히 표시
        const SCALE = 50; 

        // 직사각형 화단 추가 함수
        function addBed() {
            const widthM = parseFloat(prompt("화단의 가로 길이를 미터(m) 단위로 입력하세요 (예: 3)"));
            if (isNaN(widthM) || widthM <= 0) return;

            const heightM = parseFloat(prompt("화단의 세로 길이를 미터(m) 단위로 입력하세요 (예: 2)"));
            if (isNaN(heightM) || heightM <= 0) return;

            const bed = document.createElement('div');
            bed.classList.add('bed', 'draggable');
            
            // 크기 설정 (비율 적용)
            bed.style.width = `${widthM * SCALE}px`;
            bed.style.height = `${heightM * SCALE}px`;
            
            // 중앙에 초기 배치
            bed.style.left = `calc(50% - ${widthM * SCALE / 2}px)`;
            bed.style.top = `calc(50% - ${heightM * SCALE / 2}px)`;

            // 텍스트 추가 (m와 cm 표시)
            const widthCm = widthM * 100;
            const heightCm = heightM * 100;
            bed.innerHTML = `가로: ${widthM}m<br>(${widthCm}cm)<br>×<br>세로: ${heightM}m<br>(${heightCm}cm)`;

            canvas.appendChild(bed);
            makeDraggable(bed);
        }

        // 식물 추가 함수
        function addPlant() {
            const name = prompt("식물의 이름을 입력하세요 (예: 강낭콩, 해바라기)");
            if (!name) return;

            const plant = document.createElement('div');
            plant.classList.add('plant', 'draggable');
            
            // 중앙에 초기 배치
            plant.style.left = `calc(50% - 40px)`;
            plant.style.top = `calc(50% - 40px)`;
            plant.innerText = name;

            canvas.appendChild(plant);
            makeDraggable(plant);
        }

        // 마우스 드래그 앤 드롭 로직
        function makeDraggable(element) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            element.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = element.offsetLeft;
                initialTop = element.offsetTop;
                
                // 드래그 중인 요소를 가장 위로
                element.style.zIndex = element.classList.contains('plant') ? 100 : 50;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                element.style.left = `${initialLeft + dx}px`;
                element.style.top = `${initialTop + dy}px`;
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    // z-index 원상복구 (식물이 화단보다 항상 위에 있도록 설정)
                    element.style.zIndex = element.classList.contains('plant') ? 10 : 1;
                }
            });
        }
    </script>
</body>
</html>
