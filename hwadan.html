<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 화단 설계 도구</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #212529;
            color: #333;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 상단 툴바 */
        #toolbar {
            background-color: #2b3035;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            z-index: 100;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        button {
            padding: 9px 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            color: white;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }
        button:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-bed { background-color: #8d6e63; }
        .btn-plant { background-color: #2e7d32; }
        .btn-undo { background-color: #f39c12; }
        .btn-redo { background-color: #e67e22; }
        .btn-save { background-color: #0288d1; }
        .btn-clear { background-color: #d32f2f; }

        /* 작업 영역 (모눈종이) */
        #viewport {
            flex: 1;
            position: relative;
            background-color: #f1f3f5;
            overflow: auto;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(to right, rgba(0,0,0,0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.12) 1px, transparent 1px);
            background-size: 10px 10px, 10px 10px, 100px 100px, 100px 100px;
        }

        #canvas-area {
            position: absolute;
            width: 3000px;
            height: 2000px;
            top: 0;
            left: 0;
        }

        /* 화단 스타일 */
        .garden-bed {
            position: absolute;
            background-color: #a1887f;
            border: 3px dashed #4e342e;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.15), 4px 6px 12px rgba(0,0,0,0.1);
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .bed-dim-top {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: #4e342e;
            color: #fff;
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }
        .bed-dim-left {
            position: absolute;
            left: -32px; /* 테두리에서 바깥으로 확실히 빼냄 */
            top: 50%;
            /* 텍스트 중심을 완벽히 맞춘 후 회전하여 화단을 침범하지 않게 수정 */
            transform: translate(-50%, -50%) rotate(-90deg);
            background: #4e342e;
            color: #fff;
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }
        .bed-title {
            color: #fbe9e7;
            font-weight: 800;
            font-size: 18px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
            pointer-events: none;
        }
        .bed-size-desc {
            color: #fbe9e7;
            font-size: 13px;
            margin-top: 4px;
            font-weight: 500;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* 식물 동그라미 스타일 */
        .plant-circle {
            position: absolute;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            border: 3px solid rgba(255,255,255,0.7);
            z-index: 30;
            transition: box-shadow 0.15s ease;
            text-align: center;
            padding: 4px;
        }
        .plant-circle:hover {
            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.4), 0 6px 14px rgba(0,0,0,0.3);
        }
        .plant-name {
            font-weight: 800;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            pointer-events: none;
            line-height: 1.2;
        }
        .plant-dia {
            font-size: 11px;
            color: #f1f8e9;
            font-weight: 600;
            margin-top: 3px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            pointer-events: none;
        }

        /* 우클릭 편집 모달 */
        #editModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 8px;
        }
        .form-row {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-row label {
            font-size: 13px;
            font-weight: 600;
            color: #495057;
        }
        .form-row input, .form-row select {
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
        }
        .modal-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            gap: 8px;
        }
        .btn-confirm { background-color: #2e7d32; flex: 1; }
        .btn-cancel { background-color: #6c757d; }
        .btn-del { background-color: #d32f2f; }
    </style>
</head>
<body>

    <div id="toolbar">
        <div class="btn-group">
            <button class="btn-bed" onclick="openAddBedModal()">🟫 화단 추가</button>
            <button class="btn-plant" onclick="openAddPlantModal()">🌸 식물 추가</button>
        </div>
        <div class="btn-group">
            <button class="btn-undo" id="btnUndo" onclick="undo()" disabled>↩️ 되돌리기</button>
            <button class="btn-redo" id="btnRedo" onclick="redo()" disabled>↪️ 다시하기</button>
        </div>
        <div class="btn-group">
            <button class="btn-save" onclick="exportToImage()">📸 저장 (PNG)</button>
            <button class="btn-clear" onclick="clearCanvas()">🔄 초기화</button>
        </div>
    </div>

    <div id="viewport">
        <div id="canvas-area"></div>
    </div>

    <div id="editModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">오브젝트 편집</div>
            
            <div class="form-row">
                <label id="nameLabel">이름</label>
                <input type="text" id="objName">
            </div>

            <div id="plantSizeRow" class="form-row">
                <label>지름 (cm 단위)</label>
                <input type="number" id="objDiaCm" min="10" max="500" step="5">
            </div>

            <div id="bedSizeRow" style="display:none;">
                <div class="form-row">
                    <label>가로 길이 (m 단위)</label>
                    <input type="number" id="bedWidthM" min="0.5" max="20" step="0.1">
                </div>
                <div class="form-row">
                    <label>세로 길이 (m 단위)</label>
                    <input type="number" id="bedHeightM" min="0.5" max="20" step="0.1">
                </div>
            </div>

            <div class="form-row">
                <label>배경 색상</label>
                <input type="color" id="objColor" style="height: 40px; padding: 2px;">
            </div>

            <div class="modal-actions">
                <button class="btn-del" id="btnDelete" onclick="deleteTargetObject()">삭제</button>
                <button class="btn-cancel" onclick="closeModal()">취소</button>
                <button class="btn-confirm" onclick="applyModalChanges()">적용</button
