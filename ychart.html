<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>실시간 다중 보드 Y-Chart</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: #f6f5f0;
      background-image: radial-gradient(#e5e3d8 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      font-family: 'Pretendard', -apple-system, sans-serif;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 상단 메뉴바 */
    header {
      background: #ffffff;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2dfd2;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
      z-index: 50;
      gap: 10px;
      flex-wrap: wrap;
    }

    .board-select-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .board-select {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e293b;
      padding: 6px 10px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      outline: none;
      cursor: pointer;
      max-width: 180px;
    }

    .topic-box {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 180px;
      max-width: 320px;
    }

    .topic-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #1e293b;
      border: none;
      background: #f1ede4;
      padding: 6px 10px;
      border-radius: 6px;
      width: 100%;
      outline: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-tool {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-tool:hover { background: #e2e8f0; }
    .btn-tool.pdf-btn { background: #e0e7ff; color: #3730a3; border-color: #c7d2fe; }
    .btn-tool.pdf-btn:hover { background: #c7d2fe; }
    .btn-tool.primary { background: #334155; color: #ffffff; border-color: #334155; }
    .btn-tool.danger { color: #dc2626; border-color: #fecaca; background: #fef2f2; }

    /* Y차트 전지 캔버스 */
    #chart-board {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    .y-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .zone-hud {
      position: absolute;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
    }

    .hud-continue { top: 18px; left: 50%; transform: translateX(-50%); width: 360px; }
    .hud-stop { top: 62%; left: 30px; width: 300px; }
    .hud-start { top: 62%; right: 30px; width: 300px; }

    .input-bar {
      display: flex;
      gap: 6px;
      width: 100%;
      background: rgba(255,255,255,0.95);
      padding: 4px 6px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .input-bar input {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.85rem;
      border: 1px solid #d1cdb8;
      border-radius: 4px;
      outline: none;
      min-width: 0;
    }

    .btn-add {
      background: #334155;
      color: #fff;
      border: none;
      padding: 0 12px;
      min-width: 68px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-add:hover { background: #1e293b; }

    .zone-title {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 2.5rem;
      font-weight: bold;
      color: #334155;
      line-height: 1;
      margin-top: 6px;
      text-shadow: 1px 1px 0px rgba(255,255,255,0.85);
      pointer-events: none;
    }

    /* 1/4 미니 포스트잇 */
    .mini-note {
      position: absolute;
      width: 66px;
      height: 66px;
      background: #ffb8c6;
      box-shadow: 1px 2px 6px rgba(0, 0, 0, 0.15);
      padding: 5px 4px 3px 4px;
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      z-index: 10;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
      touch-action: none;
    }

    .mini-note:hover {
      box-shadow: 2px 6px 12px rgba(0, 0, 0, 0.22);
      z-index: 30;
    }

    .mini-note::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 6px;
      background: rgba(0, 0, 0, 0.04);
    }

    .mini-text {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 0.95rem;
      line-height: 1.15;
      color: #1e293b;
      word-break: break-all;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      pointer-events: none;
    }

    .mini-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      pointer-events: none;
    }
    .mini-likes {
      font-size: 0.68rem;
      font-weight: 800;
      color: #475569;
      background: rgba(255,255,255,0.6);
      padding: 1px 4px;
      border-radius: 8px;
    }

    .mini-note.dragging {
      cursor: grabbing;
      opacity: 0.92;
      transform: scale(1.18) !important;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
      z-index: 99 !important;
    }

    .mini-note.long-pressed {
      transform: scale(1.22) !important;
      box-shadow: 0 0 0 2px #3b82f6, 0 12px 24px rgba(0,0,0,0.3);
      z-index: 99 !important;
    }

    /* 상세 팝업 */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.show { display: flex; }

    .detail-card {
      position: relative;
      width: 100%;
      max-width: 320px;
      background: #ffb8c6;
      border-radius: 4px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.25);
      padding: 20px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-text {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 1.6rem;
      line-height: 1.35;
      color: #1e293b;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 240px;
      overflow-y: auto;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed rgba(0,0,0,0.15);
      padding-top: 10px;
    }

    .modal-btn-like {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 6px 14px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 0.95rem;
      color: #1e293b;
      cursor: pointer;
    }

    .modal-btn-del {
      background: transparent;
      border: none;
      color: #dc2626;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-btn-close {
      position: absolute;
      top: 6px; right: 10px;
      background: none; border: none;
      font-size: 1.4rem; color: #475569;
      cursor: pointer;
    }

    .guide-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      padding: 4px 14px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #475569;
      pointer-events: none;
      z-index: 40;
      white-space: nowrap;
    }

    /* PDF 보고서 서식 */
    #print-report {
      display: none;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      body {
        background: #ffffff !important;
        overflow: visible !important;
        height: auto !important;
      }
      #print-report, #print-report * {
        visibility: visible;
      }
      #print-report {
        display: block !important;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 24px 30px;
        color: #1e293b;
        background: #ffffff;
      }

      .report-header {
        border-bottom: 2px solid #0f172a;
        padding-bottom: 14px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }
      .report-title {
        font-size: 24pt;
        font-weight: 800;
        color: #0f172a;
      }
      .report-date {
        font-size: 10pt;
        color: #64748b;
      }

      .report-snapshot {
        text-align: center;
        margin-bottom: 24px;
        page-break-inside: avoid;
      }
      .report-snapshot img {
        max-width: 100%;
        max-height: 380px;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
      }

      .report-section {
        margin-bottom: 22px;
        page-break-inside: avoid;
      }
      .report-section-title {
        font-size: 13pt;
        font-weight: 800;
        padding: 6px 12px;
        border-radius: 4px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
      }
      .sec-continue { background-color: #ecfdf5; color: #065f46; border-left: 5px solid #10b981; }
      .sec-stop     { background-color: #fef2f2; color: #991b1b; border-left: 5px solid #ef4444; }
      .sec-start    { background-color: #eff6ff; color: #1e40af; border-left: 5px solid #3b82f6; }

      .report-list {
        list-style: none;
        padding-left: 6px;
      }
      .report-item {
        font-size: 11pt;
        line-height: 1.6;
        padding: 6px 10px;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .report-item:nth-child(even) {
        background-color: #f8fafc;
      }
      .report-text {
        flex: 1;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .report-badge {
        font-size: 9pt;
        font-weight: bold;
        color: #475569;
        background: #e2e8f0;
        padding: 2px 8px;
        border-radius: 12px;
        margin-left: 12px;
        white-space: nowrap;
      }
      .empty-notice {
        font-size: 10pt;
        color: #94a3b8;
        padding: 8px 12px;
        font-style: italic;
      }
    }

    @media (max-width: 768px) {
      .hud-continue { width: 92%; top: 8px; }
      .hud-stop { width: 46%; left: 8px; top: 58%; }
      .hud-start { width: 46%; right: 8px; top: 58%; }
      .zone-title { font-size: 1.8rem; }
      .mini-note { width: 60px; height: 60px; }
      .btn-add { min-width: 58px; padding: 0 8px; font-size: 0.8rem; }
      .guide-bar { font-size: 0.68rem; width: 92%; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="board-select-group">
      <select id="boardSelect" class="board-select" onchange="changeBoard(this.value)">
        <option value="main">기본 보드</option>
      </select>
      <button class="btn-tool primary" onclick="promptCreateBoard()">+ 새 보드</button>
      <button class="btn-tool danger" onclick="deleteCurrentBoard()" title="현재 보드 삭제">🗑️</button>
    </div>

    <div class="topic-box">
      <span>📝</span>
      <input type="text" id="topicInput" class="topic-title" placeholder="현재 보드 주제" />
    </div>

    <div class="toolbar">
      <button class="btn-tool pdf-btn" onclick="generatePDFReport()">📄 PDF 보고서</button>
      <button class="btn-tool" onclick="exportJPG()">📸 JPG</button>
      <button class="btn-tool" onclick="downloadJSON()">💾 백업</button>
      <button class="btn-tool" onclick="triggerFileInput()">📂 열기</button>
      <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="loadJSON(event)">
      <button class="btn-tool" onclick="clearCurrentNotes()">🧹 메모 비우기</button>
    </div>
  </header>

  <main id="chart-board">
    <svg class="y-svg" xmlns="http://www.w3.org/2000/svg">
      <line x1="5%" y1="0%" x2="50%" y2="50%" stroke="#52525b" stroke-width="3.5" stroke-linecap="round" />
      <line x1="95%" y1="0%" x2="50%" y2="50%" stroke="#52525b" stroke-width="3.5" stroke-linecap="round" />
      <line x1="50%" y1="50%" x2="50%" y2="100%" stroke="#52525b" stroke-width="3.5" stroke-linecap="round" />
    </svg>

    <div class="zone-hud hud-continue">
      <div class="input-bar">
        <input type="text" id="input-continue" placeholder="[계속] 유지할 점..." onkeydown="handleEnter(event, 'continue')">
        <button class="btn-add" onclick="addItem('continue')">붙이기</button>
      </div>
      <div class="zone-title">계속</div>
    </div>

    <div class="zone-hud hud-stop">
      <div class="input-bar">
        <input type="text" id="input-stop" placeholder="[멈춤] 개선할 점..." onkeydown="handleEnter(event, 'stop')">
        <button class="btn-add" onclick="addItem('stop')">붙이기</button>
      </div>
      <div class="zone-title">멈춤</div>
    </div>

    <div class="zone-hud hud-start">
      <div class="input-bar">
        <input type="text" id="input-start" placeholder="[도전] 시도할 점..." onkeydown="handleEnter(event, 'start')">
        <button class="btn-add" onclick="addItem('start')">붙이기</button>
      </div>
      <div class="zone-title">도전</div>
    </div>

    <div id="notes-layer"></div>

    <div class="guide-bar">
      💡 모바일: 짧게 터치(내용보기) · 길게 터치(위치이동) | PC: 마우스 드래그
    </div>
  </main>

  <!-- 상세 모달 -->
  <div class="modal-backdrop" id="detailModal" onclick="closeModal(event)">
    <div class="detail-card" onclick="event.stopPropagation()">
      <button class="modal-btn-close" onclick="closeModal()">×</button>
      <div class="modal-text" id="modalText"></div>
      <div class="modal-actions">
        <button class="modal-btn-like" id="modalLikeBtn">👍 따봉 <span id="modalLikesCount">0</span></button>
        <button class="modal-btn-del" id="modalDelBtn">삭제</button>
      </div>
    </div>
  </div>

  <!-- PDF 인쇄용 A4 전용 템플릿 -->
  <div id="print-report">
    <div class="report-header">
      <h1 class="report-title" id="reportTitle">이음 간담회 Y-Chart 회고록</h1>
      <span class="report-date" id="reportDate"></span>
    </div>

    <div class="report-snapshot" id="reportSnapshotArea"></div>

    <div class="report-section">
      <div class="report-section-title sec-continue">
        <span>🌿 계속 (Continue) — 지속 및 강화할 점</span>
        <span id="count-continue">0건</span>
      </div>
      <ul class="report-list" id="report-list-continue"></ul>
    </div>

    <div class="report-section">
      <div class="report-section-title sec-stop">
        <span>🛑 멈춤 (Stop) — 중단 및 개선할 점</span>
        <span id="count-stop">0건</span>
      </div>
      <ul class="report-list" id="report-list-stop"></ul>
    </div>

    <div class="report-section">
      <div class="report-section-title sec-start">
        <span>🚀 도전 (Start / Try) — 새롭게 시도할 점</span>
        <span id="count-start">0건</span>
      </div>
      <ul class="report-list" id="report-list-start"></ul>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAkVV8hw9KoViHvMgdjFifl4GWy5l7iZsY",
      authDomain: "e-uem-gandamhoi.firebaseapp.com",
      databaseURL: "https://e-uem-gandamhoi-default-rtdb.firebaseio.com",
      projectId: "e-uem-gandamhoi",
      storageBucket: "e-uem-gandamhoi.firebasestorage.app",
      messagingSenderId: "432155074593",
      appId: "1:432155074593:web:03b380bf35c39c9c994360",
      measurementId: "G-K71265B1V5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const boardsListRef = db.ref('board_metadata');
    let currentBoardId = 'main';
    let currentBoardRef = db.ref(`ychart_sessions/${currentBoardId}`);
    let currentSessionData = { topic: '', notes: {} };

    const boardSelect = document.getElementById('boardSelect');
    const topicInput = document.getElementById('topicInput');
    const board = document.getElementById('chart-board');
    const notesLayer = document.getElementById('notes-layer');

    boardsListRef.on('value', snap => {
      const list = snap.val();
      boardSelect.innerHTML = '';

      if (!list || Object.keys(list).length === 0) {
        boardsListRef.child('main').set({ title: '기본 보드', createdAt: Date.now() });
        return;
      }

      Object.keys(list).forEach(id => {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = list[id].title || id;
        if (id === currentBoardId) opt.selected = true;
        boardSelect.appendChild(opt);
      });

      if (!list[currentBoardId]) {
        changeBoard(Object.keys(list)[0]);
      }
    });

    function changeBoard(newBoardId) {
      if (!newBoardId) return;
      currentBoardId = newBoardId;
      boardSelect.value = newBoardId;

      currentBoardRef.off();
      currentBoardRef = db.ref(`ychart_sessions/${currentBoardId}`);

      currentBoardRef.on('value', snap => {
        currentSessionData = snap.val() || { topic: '', notes: {} };
        if (document.activeElement !== topicInput) {
          topicInput.value = currentSessionData.topic || '';
        }
        renderNotes(currentSessionData.notes);
      });
    }

    function promptCreateBoard() {
      const title = prompt('새로운 보드(분임/안건) 이름을 입력하세요:', '2분임 회고');
      if (!title || !title.trim()) return;

      const newId = 'board_' + Date.now();
      boardsListRef.child(newId).set({ title: title.trim(), createdAt: Date.now() });
      db.ref(`ychart_sessions/${newId}`).set({ topic: title.trim(), notes: null }).then(() => {
        changeBoard(newId);
      });
    }

    function deleteCurrentBoard() {
      if (boardSelect.options.length <= 1) {
        alert('최소 1개의 보드는 유지되어야 합니다.');
        return;
      }
      if (confirm(`'${boardSelect.options[boardSelect.selectedIndex].text}' 보드를 삭제하시겠습니까?`)) {
        boardsListRef.child(currentBoardId).remove();
        db.ref(`ychart_sessions/${currentBoardId}`).remove();
      }
    }

    topicInput.addEventListener('input', () => {
      const val = topicInput.value;
      currentBoardRef.child('topic').set(val);
      if (val.trim()) {
        boardsListRef.child(currentBoardId).update({ title: val.trim() });
      }
    });

    const spawnPositions = {
      continue: { minX: 30, maxX: 66, minY: 15, maxY: 42 },
      stop:     { minX: 8,  maxX: 42, minY: 55, maxY: 88 },
      start:    { minX: 56, maxX: 88, minY: 55, maxY: 88 }
    };

    function addItem(cat) {
      const input = document.getElementById(`input-${cat}`);
      const text = input.value.trim();
      if (!text) return;

      const spawn = spawnPositions[cat];
      const x = spawn.minX + Math.random() * (spawn.maxX - spawn.minX);
      const y = spawn.minY + Math.random() * (spawn.maxY - spawn.minY);
      const rot = (Math.random() * 6 - 3).toFixed(1);

      currentBoardRef.child('notes').push({
        category: cat,
        text: text,
        x: parseFloat(x.toFixed(1)),
        y: parseFloat(y.toFixed(1)),
        rot: rot,
        likes: 0,
        createdAt: Date.now()
      });

      input.value = '';
      input.focus();
    }

    function handleEnter(e, cat) {
      if (e.key === 'Enter') addItem(cat);
    }

    function renderNotes(notes) {
      const currentCards = Array.from(notesLayer.children);
      const existingKeys = new Set(notes ? Object.keys(notes) : []);

      currentCards.forEach(card => {
        if (!existingKeys.has(card.dataset.key)) card.remove();
      });

      if (!notes) return;

      Object.keys(notes).forEach(key => {
        const item = notes[key];
        let el = document.querySelector(`.mini-note[data-key="${key}"]`);

        if (!el) {
          el = document.createElement('div');
          el.className = 'mini-note';
          el.dataset.key = key;
          initInteractions(el);
          notesLayer.appendChild(el);
        }

        if (!el.classList.contains('dragging')) {
          el.style.left = `${item.x}%`;
          el.style.top = `${item.y}%`;
          el.style.setProperty('--rot', `${item.rot || 0}deg`);
          el.style.transform = `rotate(${item.rot || 0}deg)`;
        }

        el.innerHTML = `
          <div class="mini-text">${escapeHtml(item.text)}</div>
          <div class="mini-footer">
            <span class="mini-likes">👍 ${item.likes || 0}</span>
          </div>
        `;
      });
    }

    // 모바일 터치 및 PC 드래그 제스처
    function initInteractions(el) {
      let isDragging = false;
      let startX = 0, startY = 0;
      let origX = 0, origY = 0;
      let longPressTimer = null;
      let isLongPressed = false;
      let touchMoved = false;

      // 1. 모바일 터치 이벤트
      el.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        touchMoved = false;
        isLongPressed = false;

        longPressTimer = setTimeout(() => {
          isLongPressed = true;
          el.classList.add('long-pressed');
          if (navigator.vibrate) navigator.vibrate(40);
          startDrag(startX, startY);
        }, 350);
      }, { passive: true });

      el.addEventListener('touchmove', e => {
        const touch = e.touches[0];
        const dist = Math.hypot(touch.clientX - startX, touch.clientY - startY);

        if (dist > 10 && !isLongPressed) {
          clearTimeout(longPressTimer);
          touchMoved = true;
        }

        if (isLongPressed && isDragging) {
          if (e.cancelable) e.preventDefault();
          moveDrag(touch.clientX, touch.clientY);
        }
      }, { passive: false });

      el.addEventListener('touchend', e => {
        clearTimeout(longPressTimer);
        el.classList.remove('long-pressed');

        if (isDragging) {
          endDrag();
        } else if (!touchMoved && !isLongPressed) {
          if (e.cancelable) e.preventDefault();
          openDetailModal(el.dataset.key);
        }
      });

      // 2. PC 마우스 이벤트
      el.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        let mouseMoved = false;
        startDrag(e.clientX, e.clientY);

        function onMouseMove(moveEvent) {
          const dist = Math.hypot(moveEvent.clientX - startX, moveEvent.clientY - startY);
          if (dist > 5) mouseMoved = true;
          moveDrag(moveEvent.clientX, moveEvent.clientY);
        }

        function onMouseUp() {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          endDrag();
          if (!mouseMoved) {
            openDetailModal(el.dataset.key);
          }
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });

      function startDrag(clientX, clientY) {
        isDragging = true;
        el.classList.add('dragging');

        const rect = el.getBoundingClientRect();
        const parentRect = board.getBoundingClientRect();

        origX = ((rect.left - parentRect.left) / parentRect.width) * 100;
        origY = ((rect.top - parentRect.top) / parentRect.height) * 100;

        startX = clientX;
        startY = clientY;
      }

      function moveDrag(clientX, clientY) {
        if (!isDragging) return;
        const parentRect = board.getBoundingClientRect();

        const dx = ((clientX - startX) / parentRect.width) * 100;
        const dy = ((clientY - startY) / parentRect.height) * 100;

        let newX = Math.max(0, Math.min(94, origX + dx));
        let newY = Math.max(0, Math.min(92, origY + dy));

        el.style.left = `${newX}%`;
        el.style.top = `${newY}%`;
      }

      function endDrag() {
        if (!isDragging) return;
        isDragging = false;
        el.classList.remove('dragging');

        const finalX = parseFloat(el.style.left);
        const finalY = parseFloat(el.style.top);
        if (!isNaN(finalX) && !isNaN(finalY)) {
          currentBoardRef.child(`notes/${el.dataset.key}`).update({
            x: finalX,
            y: finalY
          });
        }
      }
    }

    function openDetailModal(key) {
      const note = currentSessionData.notes ? currentSessionData.notes[key] : null;
      if (!note) return;

      document.getElementById('modalText').innerText = note.text;
      document.getElementById('modalLikesCount').innerText = note.likes || 0;

      const likeBtn = document.getElementById('modalLikeBtn');
      likeBtn.onclick = () => {
        currentBoardRef.child(`notes/${key}/likes`).transaction(l => (l || 0) + 1).then(res => {
          document.getElementById('modalLikesCount').innerText = res.snapshot.val();
        });
      };

      const delBtn = document.getElementById('modalDelBtn');
      delBtn.onclick = () => {
        if (confirm('이 메모를 삭제하시겠습니까?')) {
          currentBoardRef.child(`notes/${key}`).remove();
          closeModal();
        }
      };

      document.getElementById('detailModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('show');
    }

    // PDF 보고서 생성
    async function generatePDFReport() {
      const topicName = topicInput.value.trim() || '간담회 회고';
      document.getElementById('reportTitle').innerText = topicName;
      document.getElementById('reportDate').innerText = `출력일시: ${new Date().toLocaleString('ko-KR')}`;

      const huds = document.querySelectorAll('.zone-hud');
      const guide = document.querySelector('.guide-bar');
      huds.forEach(el => el.style.visibility = 'hidden');
      guide.style.visibility = 'hidden';

      try {
        const canvas = await html2canvas(board, {
          backgroundColor: '#f6f5f0',
          scale: 1.5,
          useCORS: true
        });
        const snapshotArea = document.getElementById('reportSnapshotArea');
        snapshotArea.innerHTML = `<img src="${canvas.toDataURL('image/jpeg', 0.85)}" alt="전체 Y차트 조감도" />`;
      } catch (e) {
        console.error('캡처 생성 실패', e);
      } finally {
        huds.forEach(el => el.style.visibility = 'visible');
        guide.style.visibility = 'visible';
      }

      const categories = { continue: [], stop: [], start: [] };
      const notes = currentSessionData.notes || {};

      Object.keys(notes).forEach(k => {
        const item = notes[k];
        if (categories[item.category]) {
          categories[item.category].push(item);
        }
      });

      ['continue', 'stop', 'start'].forEach(cat => {
        const listEl = document.getElementById(`report-list-${cat}`);
        const countEl = document.getElementById(`count-${cat}`);
        listEl.innerHTML = '';

        const arr = categories[cat].sort((a, b) => (b.likes || 0) - (a.likes || 0));
        countEl.innerText = `${arr.length}건`;

        if (arr.length === 0) {
          listEl.innerHTML = `<li class="empty-notice">- 등록된 내용이 없습니다.</li>`;
        } else {
          arr.forEach(item => {
            const li = document.createElement('li');
            li.className = 'report-item';
            li.innerHTML = `
              <span class="report-text">• ${escapeHtml(item.text)}</span>
              <span class="report-badge">👍 ${item.likes || 0}</span>
            `;
            listEl.appendChild(li);
          });
        }
      });

      window.print();
    }

    async function exportJPG() {
      const huds = document.querySelectorAll('.zone-hud');
      const guide = document.querySelector('.guide-bar');
      huds.forEach(el => el.style.visibility = 'hidden');
      guide.style.visibility = 'hidden';

      try {
        const canvas = await html2canvas(board, {
          backgroundColor: '#f6f5f0',
          scale: 2,
          useCORS: true
        });
        const image = canvas.toDataURL('image/jpeg', 0.95);
        const link = document.createElement('a');
        const topicName = topicInput.value.trim() || '간담회_보드';
        link.download = `${topicName}_${new Date().toISOString().slice(0,10)}.jpg`;
        link.href = image;
        link.click();
      } catch (err) {
        alert('이미지 저장 오류: ' + err.message);
      } finally {
        huds.forEach(el => el.style.visibility = 'visible');
        guide.style.visibility = 'visible';
      }
    }

    function downloadJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentSessionData, null, 2));
      const a = document.createElement('a');
      const topicName = topicInput.value.trim() || '보드_백업';
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `${topicName}_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function triggerFileInput() { document.getElementById('fileInput').click(); }

    function loadJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (confirm('파일을 불러오시겠습니까? 현재 보드의 내용이 덮어씌워집니다.')) {
            currentBoardRef.set(parsed);
          }
        } catch (err) { alert('올바른 JSON 파일이 아닙니다.'); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function clearCurrentNotes() {
      if (confirm('현재 보드의 모든 메모를 비우시겠습니까? (보드 자체는 유지됩니다)')) {
        currentBoardRef.child('notes').remove();
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)
      );
    }

    changeBoard('main');
  </script>
</body>
