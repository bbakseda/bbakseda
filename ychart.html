<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>이음 간담회 다중 보드 Y-Chart</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: #f6f5f0;
      background-image: radial-gradient(#e5e3d8 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      font-family: 'Pretendard', -apple-system, sans-serif;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    header {
      background: #ffffff;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2dfd2;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
      z-index: 50;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .board-select {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e293b;
      padding: 5px 8px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      outline: none;
      cursor: pointer;
      max-width: 150px;
    }

    .my-team-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #f1f5f9;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
    }
    .my-team-label {
      font-size: 0.78rem;
      font-weight: 800;
      color: #475569;
    }
    .select-global-team {
      font-size: 0.85rem;
      font-weight: 800;
      color: #1e293b;
      padding: 3px 6px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #ffffff;
      outline: none;
      cursor: pointer;
    }

    .topic-box {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 150px;
      max-width: 260px;
    }

    .topic-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #1e293b;
      border: none;
      background: #f1ede4;
      padding: 6px 10px;
      border-radius: 6px;
      width: 100%;
      outline: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-tool {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-tool:hover { background: #e2e8f0; }
    .btn-tool.pdf-btn { background: #e0e7ff; color: #3730a3; border-color: #c7d2fe; }
    .btn-tool.pdf-btn:hover { background: #c7d2fe; }
    .btn-tool.primary { background: #334155; color: #ffffff; border-color: #334155; }
    .btn-tool.danger { color: #dc2626; border-color: #fecaca; background: #fef2f2; }

    #chart-board {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    .y-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .zone-hud {
      position: absolute;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
    }

    .hud-continue { top: 12px; left: 50%; transform: translateX(-50%); width: 380px; }
    .hud-stop { top: 60%; left: 24px; width: 310px; }
    .hud-start { top: 60%; right: 24px; width: 310px; }

    .input-bar {
      display: flex;
      gap: 5px;
      width: 100%;
      background: rgba(255,255,255,0.96);
      padding: 5px 6px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      align-items: center;
    }

    .input-bar input.input-text {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.85rem;
      border: 1px solid #d1cdb8;
      border-radius: 4px;
      outline: none;
      min-width: 0;
    }

    .input-bar input.input-pwd {
      width: 55px;
      padding: 6px 4px;
      font-size: 0.8rem;
      border: 1px solid #d1cdb8;
      border-radius: 4px;
      outline: none;
      text-align: center;
    }

    .btn-add {
      background: #334155;
      color: #fff;
      border: none;
      padding: 0 12px;
      min-width: 60px;
      height: 32px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-add:hover { background: #1e293b; }

    .zone-title {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 2.5rem;
      font-weight: bold;
      color: #334155;
      line-height: 1;
      margin-top: 4px;
      text-shadow: 1px 1px 0px rgba(255,255,255,0.85);
      pointer-events: none;
    }

    .mini-note {
      position: absolute;
      width: 68px;
      height: 68px;
      box-shadow: 1px 2px 6px rgba(0, 0, 0, 0.15);
      padding: 4px 4px 3px 4px;
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      z-index: 10;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
      touch-action: none;
    }

    .mini-note:hover {
      box-shadow: 2px 6px 12px rgba(0, 0, 0, 0.22);
      z-index: 30;
    }

    .mini-note::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 5px;
      background: rgba(0, 0, 0, 0.05);
    }

    .mini-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.6rem;
      font-weight: 800;
      color: rgba(0,0,0,0.55);
      line-height: 1;
      pointer-events: none;
    }

    .mini-text {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 0.95rem;
      line-height: 1.15;
      color: #1e293b;
      word-break: break-all;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      pointer-events: none;
    }

    .mini-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      pointer-events: none;
    }
    .mini-likes {
      font-size: 0.65rem;
      font-weight: 800;
      color: #334155;
      background: rgba(255,255,255,0.65);
      padding: 1px 3px;
      border-radius: 6px;
    }

    .mini-note.dragging {
      cursor: grabbing;
      opacity: 0.92;
      transform: scale(1.18) !important;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
      z-index: 99 !important;
    }

    .mini-note.long-pressed {
      transform: scale(1.22) !important;
      box-shadow: 0 0 0 2px #3b82f6, 0 12px 24px rgba(0,0,0,0.3);
      z-index: 99 !important;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.show { display: flex; }

    .detail-card {
      position: relative;
      width: 100%;
      max-width: 340px;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.25);
      padding: 20px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-team-tag {
      font-size: 0.8rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 12px;
      display: inline-block;
      align-self: flex-start;
    }

    .modal-text {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 1.6rem;
      line-height: 1.35;
      color: #1e293b;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 220px;
      overflow-y: auto;
      padding: 4px;
    }

    .modal-edit-box {
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .modal-edit-textarea {
      font-family: 'Pretendard', sans-serif;
      font-size: 0.95rem;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      resize: vertical;
      min-height: 80px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed rgba(0,0,0,0.15);
      padding-top: 10px;
      gap: 6px;
    }

    .modal-btn-like {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 0.9rem;
      color: #1e293b;
      cursor: pointer;
    }

    .modal-sub-actions {
      display: flex;
      gap: 6px;
    }

    .modal-btn-edit {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
    }

    .modal-btn-del {
      background: transparent;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .modal-btn-close {
      position: absolute;
      top: 6px; right: 10px;
      background: none; border: none;
      font-size: 1.4rem; color: #475569;
      cursor: pointer;
    }

    .guide-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      padding: 4px 14px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #475569;
      pointer-events: none;
      z-index: 40;
      white-space: nowrap;
    }

    #print-report { display: none; }

    @media print {
      body * { visibility: hidden; }
      body { background: #ffffff !important; overflow: visible !important; height: auto !important; }
      #print-report, #print-report * { visibility: visible; }
      #print-report {
        display: block !important;
        position: absolute;
        top: 0; left: 0; width: 100%;
        padding: 24px 30px;
        color: #1e293b;
        background: #ffffff;
      }
      .report-header {
        border-bottom: 2px solid #0f172a;
        padding-bottom: 14px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }
      .report-title { font-size: 24pt; font-weight: 800; color: #0f172a; }
      .report-date { font-size: 10pt; color: #64748b; }
      .report-snapshot { text-align: center; margin-bottom: 24px; page-break-inside: avoid; }
      .report-snapshot img { max-width: 100%; max-height: 380px; border: 1px solid #e2e8f0; border-radius: 6px; }
      .report-section { margin-bottom: 22px; page-break-inside: avoid; }
      .report-section-title {
        font-size: 13pt; font-weight: 800; padding: 6px 12px; border-radius: 4px;
        margin-bottom: 10px; display: flex; justify-content: space-between;
      }
      .sec-continue { background-color: #ecfdf5; color: #065f46; border-left: 5px solid #10b981; }
      .sec-stop     { background-color: #fef2f2; color: #991b1b; border-left: 5px solid #ef4444; }
      .sec-start    { background-color: #eff6ff; color: #1e40af; border-left: 5px solid #3b82f6; }
      .report-list { list-style: none; padding-left: 6px; }
      .report-item {
        font-size: 11pt; line-height: 1.6; padding: 6px 10px; border-bottom: 1px solid #f1f5f9;
        display: flex; justify-content: space-between; align-items: baseline;
      }
      .report-item:nth-child(even) { background-color: #f8fafc; }
      .report-text { flex: 1; white-space: pre-wrap; word-break: break-word; }
      .report-team-tag { font-size: 9pt; font-weight: bold; margin-right: 6px; }
      .report-badge {
        font-size: 9pt; font-weight: bold; color: #475569; background: #e2e8f0;
        padding: 2px 8px; border-radius: 12px; margin-left: 12px; white-space: nowrap;
      }
      .empty-notice { font-size: 10pt; color: #94a3b8; padding: 8px 12px; font-style: italic; }
    }

    @media (max-width: 768px) {
      .hud-continue { width: 94%; top: 6px; }
      .hud-stop { width: 48%; left: 4px; top: 58%; }
      .hud-start { width: 48%; right: 4px; top: 58%; }
      .zone-title { font-size: 1.8rem; }
      .mini-note { width: 62px; height: 62px; }
      .input-bar input.input-pwd { width: 44px; font-size: 0.75rem; padding: 4px 2px; }
      .btn-add { min-width: 48px; padding: 0 6px; font-size: 0.78rem; }
      .guide-bar { font-size: 0.68rem; width: 92%; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <select id="boardSelect" class="board-select" onchange="changeBoard(this.value)">
        <option value="main">기본 보드</option>
      </select>
      <button class="btn-tool primary" onclick="promptCreateBoard()">+ 새 보드</button>
      <button class="btn-tool danger" onclick="deleteCurrentBoard()" title="현재 보드 삭제 (관리자용)">🗑️</button>

      <div class="my-team-group">
        <span class="my-team-label">모둠:</span>
        <select id="globalTeamSelect" class="select-global-team" onchange="changeGlobalTeam(this.value)">
          <option value="1">1모둠</option>
          <option value="2">2모둠</option>
          <option value="3">3모둠</option>
          <option value="4">4모둠</option>
          <option value="5">5모둠</option>
          <option value="6">6모둠</option>
        </select>
      </div>
    </div>

    <div class="topic-box">
      <span>📝</span>
      <input type="text" id="topicInput" class="topic-title" placeholder="현재 보드 주제" />
    </div>

    <div class="toolbar">
      <button class="btn-tool pdf-btn" onclick="generatePDFReport()">📄 PDF 보고서</button>
      <button class="btn-tool" onclick="exportJPG()">📸 JPG</button>
      <button class="btn-tool" onclick="downloadJSON()">💾 백업</button>
      <button class="btn-tool" onclick="triggerFileInput()">📂 열기</button>
      <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="loadJSON(event)">
      <button class="btn-tool danger" onclick="clearCurrentNotes()">🧹 비우기</button>
    </div>
  </header>

  <main id="chart-board">
    <svg class="y-svg" xmlns="http://www.w3.org/2000/svg">
      <line x1="5%" y1="0%" x2="50%" y2="50%" stroke="#52525b" stroke-width="3.5" stroke-linecap="round" />
      <line x1="95%" y1="0%" x2="50%" y2="50%" stroke="#52525b" stroke-width="3.5" stroke-linecap="round" />
      <line x1="50%" y1="50%" x2="50%" y2="100%" stroke="#52525b" stroke-width="3.5" stroke-linecap="round" />
    </svg>

    <!-- 1. 계속 (손글씨: 계속 / 안내문구: 장점: 유지할 점) -->
    <div class="zone-hud hud-continue">
      <div class="input-bar">
        <input type="text" id="input-continue" class="input-text" placeholder="장점: 유지할 점" onkeydown="handleEnter(event, 'continue')">
        <input type="password" id="pwd-continue" class="input-pwd" placeholder="비번" maxlength="8">
        <button class="btn-add" onclick="addItem('continue')">붙이기</button>
      </div>
      <div class="zone-title">계속</div>
    </div>

    <!-- 2. 멈춤 (손글씨: 멈춤 / 안내문구: 고충: 개선할 점) -->
    <div class="zone-hud hud-stop">
      <div class="input-bar">
        <input type="text" id="input-stop" class="input-text" placeholder="고충: 개선할 점" onkeydown="handleEnter(event, 'stop')">
        <input type="password" id="pwd-stop" class="input-pwd" placeholder="비번" maxlength="8">
        <button class="btn-add" onclick="addItem('stop')">붙이기</button>
      </div>
      <div class="zone-title">멈춤</div>
    </div>

    <!-- 3. 도전 (손글씨: 도전 / 안내문구: 제안: 필요사항) -->
    <div class="zone-hud hud-start">
      <div class="input-bar">
        <input type="text" id="input-start" class="input-text" placeholder="제안: 필요사항" onkeydown="handleEnter(event, 'start')">
        <input type="password" id="pwd-start" class="input-pwd" placeholder="비번" maxlength="8">
        <button class="btn-add" onclick="addItem('start')">붙이기</button>
      </div>
      <div class="zone-title">도전</div>
    </div>

    <div id="notes-layer"></div>

    <div class="guide-bar">
      💡 모바일: 짧게 터치(내용보기) · 길게 터치(위치이동) | PC: 마우스 드래그
    </div>
  </main>

  <div class="modal-backdrop" id="detailModal" onclick="closeModal(event)">
    <div class="detail-card" id="modalCard" onclick="event.stopPropagation()">
      <button class="modal-btn-close" onclick="closeModal()">×</button>
      
      <span class="modal-team-tag" id="modalTeamTag">1모둠</span>
      
      <div class="modal-text" id="modalText"></div>
      
      <div class="modal-edit-box" id="modalEditBox">
        <textarea id="modalEditTextarea" class="modal-edit-textarea"></textarea>
        <div style="display:flex; justify-content: flex-end; gap:6px;">
          <button class="modal-btn-edit" onclick="cancelEdit()">취소</button>
          <button class="modal-btn-edit" style="background:#334155; color:#fff;" onclick="saveEdit()">저장</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="modal-btn-like" id="modalLikeBtn">👍 따봉 <span id="modalLikesCount">0</span></button>
        <div class="modal-sub-actions">
          <button class="modal-btn-edit" onclick="startEdit()">수정</button>
          <button class="modal-btn-del" onclick="handleDeleteNote()">삭제</button>
        </div>
      </div>
    </div>
  </div>

  <div id="print-report">
    <div class="report-header">
      <h1 class="report-title" id="reportTitle">이음 간담회 Y-Chart 회고록</h1>
      <span class="report-date" id="reportDate"></span>
    </div>

    <div class="report-snapshot" id="reportSnapshotArea"></div>

    <div class="report-section">
      <div class="report-section-title sec-continue">
        <span>🌿 계속 (Continue) — 장점: 유지할 점</span>
        <span id="count-continue">0건</span>
      </div>
      <ul class="report-list" id="report-list-continue"></ul>
    </div>

    <div class="report-section">
      <div class="report-section-title sec-stop">
        <span>🛑 멈춤 (Stop) — 고충: 개선할 점</span>
        <span id="count-stop">0건</span>
      </div>
      <ul class="report-list" id="report-list-stop"></ul>
    </div>

    <div class="report-section">
      <div class="report-section-title sec-start">
        <span>🚀 도전 (Start / Try) — 제안: 필요사항</span>
        <span id="count-start">0건</span>
      </div>
      <ul class="report-list" id="report-list-start"></ul>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "5652";

    const TEAM_COLORS = {
      "1": { bg: "#ffb8c6", tag: "1모둠", text: "#881337" },
      "2": { bg: "#fef08a", tag: "2모둠", text: "#713f12" },
      "3": { bg: "#bbf7d0", tag: "3모둠", text: "#14532d" },
      "4": { bg: "#bfdbfe", tag: "4모둠", text: "#1e3a8a" },
      "5": { bg: "#e9d5ff", tag: "5모둠", text: "#581c87" },
      "6": { bg: "#fed7aa", tag: "6모둠", text: "#7c2d12" }
    };

    let currentGlobalTeam = localStorage.getItem('ychart_my_team') || "1";

    const firebaseConfig = {
      apiKey: "AIzaSyAkVV8hw9KoViHvMgdjFifl4GWy5l7iZsY",
      authDomain: "e-uem-gandamhoi.firebaseapp.com",
      databaseURL: "https://e-uem-gandamhoi-default-rtdb.firebaseio.com",
      projectId: "e-uem-gandamhoi",
      storageBucket: "e-uem-gandamhoi.firebasestorage.app",
      messagingSenderId: "432155074593",
      appId: "1:432155074593:web:03b380bf35c39c9c994360",
      measurementId: "G-K71265B1V5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const boardsListRef = db.ref('board_metadata');
    let currentBoardId = 'main';
    let currentBoardRef = db.ref(`ychart_sessions/${currentBoardId}`);
    let currentSessionData = { topic: '', notes: {} };

    const boardSelect = document.getElementById('boardSelect');
    const globalTeamSelect = document.getElementById('globalTeamSelect');
    const topicInput = document.getElementById('topicInput');
    const board = document.getElementById('chart-board');
    const notesLayer = document.getElementById('notes-layer');

    globalTeamSelect.value = currentGlobalTeam;
    function changeGlobalTeam(val) {
      currentGlobalTeam = val;
      localStorage.setItem('ychart_my_team', val);
    }

    boardsListRef.on('value', snap => {
      const list = snap.val();
      boardSelect.innerHTML = '';

      if (!list || Object.keys(list).length === 0) {
        boardsListRef.child('main').set({ title: '기본 보드', createdAt: Date.now() });
        return;
      }

      Object.keys(list).forEach(id => {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = list[id].title || id;
        if (id === currentBoardId) opt.selected = true;
        boardSelect.appendChild(opt);
      });

      if (!list[currentBoardId]) {
        changeBoard(Object.keys(list)[0]);
      }
    });

    function changeBoard(newBoardId) {
      if (!newBoardId) return;
      currentBoardId = newBoardId;
      boardSelect.value = newBoardId;

      currentBoardRef.off();
      currentBoardRef = db.ref(`ychart_sessions/${currentBoardId}`);

      currentBoardRef.on('value', snap => {
        currentSessionData = snap.val() || { topic: '', notes: {} };
        if (document.activeElement !== topicInput) {
          topicInput.value = currentSessionData.topic || '';
        }
        renderNotes(currentSessionData.notes);
      });
    }

    function promptCreateBoard() {
      const title = prompt('새로운 보드(분임/안건) 이름을 입력하세요:', '2분임 회고');
      if (!title || !title.trim()) return;

      const newId = 'board_' + Date.now();
      boardsListRef.child(newId).set({ title: title.trim(), createdAt: Date.now() });
      db.ref(`ychart_sessions/${newId}`).set({ topic: title.trim(), notes: null }).then(() => {
        changeBoard(newId);
      });
    }

    function deleteCurrentBoard() {
      if (boardSelect.options.length <= 1) {
        alert('최소 1개의 보드는 유지되어야 합니다.');
        return;
      }

      const pwd = prompt(`'${boardSelect.options[boardSelect.selectedIndex].text}' 보드를 삭제하려면 관리자 비밀번호를 입력하세요:`);
      if (pwd === ADMIN_PASSWORD) {
        boardsListRef.child(currentBoardId).remove();
        db.ref(`ychart_sessions/${currentBoardId}`).remove();
        alert('보드가 삭제되었습니다.');
      } else if (pwd !== null) {
        alert('관리자 비밀번호가 일치하지 않습니다.');
      }
    }

    function clearCurrentNotes() {
      const pwd = prompt('현재 보드의 모든 메모를 비우려면 관리자 비밀번호를 입력하세요:');
      if (pwd === ADMIN_PASSWORD) {
        currentBoardRef.child('notes').remove();
        alert('보드의 모든 메모가 초기화되었습니다.');
      } else if (pwd !== null) {
        alert('관리자 비밀번호가 일치하지 않습니다.');
      }
    }

    topicInput.addEventListener('input', () => {
      const val = topicInput.value;
      currentBoardRef.child('topic').set(val);
      if (val.trim()) {
        boardsListRef.child(currentBoardId).update({ title: val.trim() });
      }
    });

    function determineCategoryByPosition(x, y) {
      const isAboveLeftDiag = y < (1.111 * (x - 5));
      const isAboveRightDiag = y < (-1.111 * (x - 95));

      if (isAboveLeftDiag && isAboveRightDiag) return 'continue';
      return (x < 50) ? 'stop' : 'start';
    }

    const spawnPositions = {
      continue: { minX: 30, maxX: 66, minY: 15, maxY: 40 },
      stop:     { minX: 8,  maxX: 42, minY: 55, maxY: 88 },
      start:    { minX: 56, maxX: 88, minY: 55, maxY: 88 }
    };

    function addItem(cat) {
      const input = document.getElementById(`input-${cat}`);
      const pwdInput = document.getElementById(`pwd-${cat}`);

      const text = input.value.trim();
      if (!text) return;

      const team = currentGlobalTeam || "1";
      const pwd = pwdInput.value.trim();

      const spawn = spawnPositions[cat];
      const x = spawn.minX + Math.random() * (spawn.maxX - spawn.minX);
      const y = spawn.minY + Math.random() * (spawn.maxY - spawn.minY);
      const rot = (Math.random() * 6 - 3).toFixed(1);

      const actualCat = determineCategoryByPosition(x, y);

      currentBoardRef.child('notes').push({
        category: actualCat,
        team: team,
        text: text,
        pwd: pwd,
        x: parseFloat(x.toFixed(1)),
        y: parseFloat(y.toFixed(1)),
        rot: rot,
        likes: 0,
        createdAt: Date.now()
      });

      input.value = '';
      pwdInput.value = '';
      input.focus();
    }

    function handleEnter(e, cat) {
      if (e.key === 'Enter') addItem(cat);
    }

    function renderNotes(notes) {
      const currentCards = Array.from(notesLayer.children);
      const existingKeys = new Set(notes ? Object.keys(notes) : []);

      currentCards.forEach(card => {
        if (!existingKeys.has(card.dataset.key)) card.remove();
      });

      if (!notes) return;

      Object.keys(notes).forEach(key => {
        const item = notes[key];
        let el = document.querySelector(`.mini-note[data-key="${key}"]`);
        const teamInfo = TEAM_COLORS[item.team] || TEAM_COLORS["1"];

        if (!el) {
          el = document.createElement('div');
          el.className = 'mini-note';
          el.dataset.key = key;
          initInteractions(el);
          notesLayer.appendChild(el);
        }

        el.style.backgroundColor = teamInfo.bg;

        if (!el.classList.contains('dragging')) {
          el.style.left = `${item.x}%`;
          el.style.top = `${item.y}%`;
          el.style.setProperty('--rot', `${item.rot || 0}deg`);
          el.style.transform = `rotate(${item.rot || 0}deg)`;
        }

        el.innerHTML = `
          <div class="mini-header">
            <span>${teamInfo.tag}</span>
          </div>
          <div class="mini-text">${escapeHtml(item.text)}</div>
          <div class="mini-footer">
            <span class="mini-likes">👍 ${item.likes || 0}</span>
          </div>
        `;
      });
    }

    function initInteractions(el) {
      let isDragging = false;
      let startX = 0, startY = 0;
      let origX = 0, origY = 0;
      let longPressTimer = null;
      let isLongPressed = false;
      let touchMoved = false;

      el.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        touchMoved = false;
        isLongPressed = false;

        longPressTimer = setTimeout(() => {
          isLongPressed = true;
          el.classList.add('long-pressed');
          if (navigator.vibrate) navigator.vibrate(40);
          startDrag(startX, startY);
        }, 350);
      }, { passive: true });

      el.addEventListener('touchmove', e => {
        const touch = e.touches[0];
        const dist = Math.hypot(touch.clientX - startX, touch.clientY - startY);

        if (dist > 10 && !isLongPressed) {
          clearTimeout(longPressTimer);
          touchMoved = true;
        }

        if (isLongPressed && isDragging) {
          if (e.cancelable) e.preventDefault();
          moveDrag(touch.clientX, touch.clientY);
        }
      }, { passive: false });

      el.addEventListener('touchend', e => {
        clearTimeout(longPressTimer);
        el.classList.remove('long-pressed');

        if (isDragging) {
          endDrag();
        } else if (!touchMoved && !isLongPressed) {
          if (e.cancelable) e.preventDefault();
          openDetailModal(el.dataset.key);
        }
      });

      el.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        let mouseMoved = false;
        startDrag(e.clientX, e.clientY);

        function onMouseMove(moveEvent) {
          const dist = Math.hypot(moveEvent.clientX - startX, moveEvent.clientY - startY);
          if (dist > 5) mouseMoved = true;
          moveDrag(moveEvent.clientX, moveEvent.clientY);
        }

        function onMouseUp() {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          endDrag();
          if (!mouseMoved) {
            openDetailModal(el.dataset.key);
          }
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });

      function startDrag(clientX, clientY) {
        isDragging = true;
        el.classList.add('dragging');

        const rect = el.getBoundingClientRect();
        const parentRect = board.getBoundingClientRect();

        origX = ((rect.left - parentRect.left) / parentRect.width) * 100;
        origY = ((rect.top - parentRect.top) / parentRect.height) * 100;

        startX = clientX;
        startY = clientY;
      }

      function moveDrag(clientX, clientY) {
        if (!isDragging) return;
        const parentRect = board.getBoundingClientRect();

        const dx = ((clientX - startX) / parentRect.width) * 100;
        const dy = ((clientY - startY) / parentRect.height) * 100;

        let newX = Math.max(0, Math.min(94, origX + dx));
        let newY = Math.max(0, Math.min(92, origY + dy));

        el.style.left = `${newX}%`;
        el.style.top = `${newY}%`;
      }

      function endDrag() {
        if (!isDragging) return;
        isDragging = false;
        el.classList.remove('dragging');

        const finalX = parseFloat(el.style.left);
        const finalY = parseFloat(el.style.top);

        if (!isNaN(finalX) && !isNaN(finalY)) {
          const newCategory = determineCategoryByPosition(finalX + 3, finalY + 3);
          currentBoardRef.child(`notes/${el.dataset.key}`).update({
            x: finalX,
            y: finalY,
            category: newCategory
          });
        }
      }
    }

    let activeModalKey = null;

    function openDetailModal(key) {
      activeModalKey = key;
      const note = currentSessionData.notes ? currentSessionData.notes[key] : null;
      if (!note) return;

      const teamInfo = TEAM_COLORS[note.team] || TEAM_COLORS["1"];
      const modalCard = document.getElementById('modalCard');
      modalCard.style.backgroundColor = teamInfo.bg;

      const teamTag = document.getElementById('modalTeamTag');
      teamTag.innerText = teamInfo.tag;
      teamTag.style.backgroundColor = "rgba(255,255,255,0.7)";
      teamTag.style.color = teamInfo.text;

      document.getElementById('modalText').innerText = note.text;
      document.getElementById('modalText').style.display = 'block';
      document.getElementById('modalEditBox').style.display = 'none';

      document.getElementById('modalLikesCount').innerText = note.likes || 0;

      const likeBtn = document.getElementById('modalLikeBtn');
      likeBtn.onclick = () => {
        currentBoardRef.child(`notes/${key}/likes`).transaction(l => (l || 0) + 1).then(res => {
          document.getElementById('modalLikesCount').innerText = res.snapshot.val();
        });
      };

      document.getElementById('detailModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('show');
      activeModalKey = null;
    }

    function startEdit() {
      const note = currentSessionData.notes ? currentSessionData.notes[activeModalKey] : null;
      if (!note) return;

      const inputPwd = prompt('작성 시 입력한 비밀번호(또는 관리자 비밀번호)를 입력하세요:');
      if (inputPwd === null) return;

      if ((note.pwd && inputPwd === note.pwd) || inputPwd === ADMIN_PASSWORD || (!note.pwd && inputPwd === ADMIN_PASSWORD)) {
        document.getElementById('modalText').style.display = 'none';
        document.getElementById('modalEditBox').style.display = 'flex';
        document.getElementById('modalEditTextarea').value = note.text;
        document.getElementById('modalEditTextarea').focus();
      } else {
        alert('비밀번호가 일치하지 않습니다.');
      }
    }

    function cancelEdit() {
      document.getElementById('modalText').style.display = 'block';
      document.getElementById('modalEditBox').style.display = 'none';
    }

    function saveEdit() {
      const newText = document.getElementById('modalEditTextarea').value.trim();
      if (!newText) {
        alert('내용을 입력해 주세요.');
        return;
      }

      currentBoardRef.child(`notes/${activeModalKey}`).update({
        text: newText
      }).then(() => {
        document.getElementById('modalText').innerText = newText;
        cancelEdit();
      });
    }

    function handleDeleteNote() {
      const note = currentSessionData.notes ? currentSessionData.notes[activeModalKey] : null;
      if (!note) return;

      const inputPwd = prompt('삭제하려면 작성 시 비밀번호(또는 관리자 비밀번호)를 입력하세요:');
      if (inputPwd === null) return;

      if ((note.pwd && inputPwd === note.pwd) || inputPwd === ADMIN_PASSWORD || (!note.pwd && inputPwd === ADMIN_PASSWORD)) {
        currentBoardRef.child(`notes/${activeModalKey}`).remove();
        closeModal();
      } else {
        alert('비밀번호가 일치하지 않습니다.');
      }
    }

    async function generatePDFReport() {
      const topicName = topicInput.value.trim() || '간담회 회고';
      document.getElementById('reportTitle').innerText = topicName;
      document.getElementById('reportDate').innerText = `출력일시: ${new Date().toLocaleString('ko-KR')}`;

      const huds = document.querySelectorAll('.zone-hud');
      const guide = document.querySelector('.guide-bar');
      huds.forEach(el => el.style.visibility = 'hidden');
      guide.style.visibility = 'hidden';

      try {
        const canvas = await html2canvas(board, {
          backgroundColor: '#f6f5f0',
          scale: 1.5,
          useCORS: true
        });
        const snapshotArea = document.getElementById('reportSnapshotArea');
        snapshotArea.innerHTML = `<img src="${canvas.toDataURL('image/jpeg', 0.85)}" alt="전체 Y차트 조감도" />`;
      } catch (e) {
        console.error('캡처 생성 실패', e);
      } finally {
        huds.forEach(el => el.style.visibility = 'visible');
        guide.style.visibility = 'visible';
      }

      const categories = { continue: [], stop: [], start: [] };
      const notes = currentSessionData.notes || {};

      Object.keys(notes).forEach(k => {
        const item = notes[k];
        const cat = determineCategoryByPosition(item.x + 3, item.y + 3);
        if (categories[cat]) categories[cat].push(item);
      });

      ['continue', 'stop', 'start'].forEach(cat => {
        const listEl = document.getElementById(`report-list-${cat}`);
        const countEl = document.getElementById(`count-${cat}`);
        listEl.innerHTML = '';

        const arr = categories[cat].sort((a, b) => (b.likes || 0) - (a.likes || 0));
        countEl.innerText = `${arr.length}건`;

        if (arr.length === 0) {
          listEl.innerHTML = `<li class="empty-notice">- 등록된 내용이 없습니다.</li>`;
        } else {
          arr.forEach(item => {
            const team = item.team || '1';
            const li = document.createElement('li');
            li.className = 'report-item';
            li.innerHTML = `
              <span class="report-text"><span class="report-team-tag">[${team}모둠]</span>• ${escapeHtml(item.text)}</span>
              <span class="report-badge">👍 ${item.likes || 0}</span>
            `;
            listEl.appendChild(li);
          });
        }
      });

      window.print();
    }

    async function exportJPG() {
      const huds = document.querySelectorAll('.zone-hud');
      const guide = document.querySelector('.guide-bar');
      huds.forEach(el => el.style.visibility = 'hidden');
      guide.style.visibility = 'hidden';

      try {
        const canvas = await html2canvas(board, {
          backgroundColor: '#f6f5f0',
          scale: 2,
          useCORS: true
        });
        const image = canvas.toDataURL('image/jpeg', 0.95);
        const link = document.createElement('a');
        const topicName = topicInput.value.trim() || '간담회_보드';
        link.download = `${topicName}_${new Date().toISOString().slice(0,10)}.jpg`;
        link.href = image;
        link.click();
      } catch (err) {
        alert('이미지 저장 오류: ' + err.message);
      } finally {
        huds.forEach(el => el.style.visibility = 'visible');
        guide.style.visibility = 'visible';
      }
    }

    function downloadJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentSessionData, null, 2));
      const a = document.createElement('a');
      const topicName = topicInput.value.trim() || '보드_백업';
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `${topicName}_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function triggerFileInput() { document.getElementById('fileInput').click(); }

    function loadJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (confirm('파일을 불러오시겠습니까? 현재 보드의 내용이 덮어씌워집니다.')) {
            currentBoardRef.set(parsed);
          }
        } catch (err) { alert('올바른 JSON 파일이 아닙니다.'); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)
      );
    }

    changeBoard('main');
  </script>
